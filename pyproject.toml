[project]
name = "docling-local-review-app"
version = "0.1.0"
description = "Tiny local Streamlit review app for source files and Docling outputs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.41.0",
  "pandas>=2.2.0",
  "python-pptx>=1.0.2",
  "Pillow>=10.3.0",
  "bleach>=6.2.0",
  "beautifulsoup4>=4.12.3",
  "Markdown>=3.7",
  "pypdfium2>=4.30.0",
  "pywin32>=306; platform_system == 'Windows'",
]
